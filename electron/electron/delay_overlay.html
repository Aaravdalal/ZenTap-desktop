<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTap - Website Blocked</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(10, 10, 20, 0.95);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }
        .backdrop {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 480px;
        }
        .icon {
            font-size: 72px;
            margin-bottom: 24px;
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .domain {
            font-size: 18px;
            color: #a0a0b0;
            margin-bottom: 32px;
            font-family: monospace;
        }
        .timer-circle {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 32px;
        }
        .timer-circle svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .timer-circle .bg-circle { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
        .timer-circle .progress-circle {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 295;
            stroke-dashoffset: 295;
            transition: stroke-dashoffset 1s linear;
        }
        .timer-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: 300;
        }
        .message { font-size: 15px; color: #8890a0; line-height: 1.6; margin-bottom: 24px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ee5a24); border-radius: 3px; width: 0%; transition: width 0.1s linear; }
        .btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 20px;
            transition: all 0.2s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
    </style>
</head>
<body>
    <div class="backdrop"></div>
    <div class="container">
        <div class="icon">🧘</div>
        <h1>Stay Focused</h1>
        <div class="domain" id="domainDisplay">Blocked Site</div>
        <div class="timer-circle">
            <svg viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff6b6b"/>
                        <stop offset="100%" stop-color="#f7d794"/>
                    </linearGradient>
                </defs>
                <circle class="bg-circle" cx="50" cy="50" r="47"/>
                <circle class="progress-circle" id="progressCircle" cx="50" cy="50" r="47"/>
            </svg>
            <div class="timer-text" id="timerText">5</div>
        </div>
        <p class="message">You can continue in <strong id="countdownText">5</strong> seconds.</p>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const domain = params.get('domain') || 'blocked-site';
        const delaySeconds = parseInt(params.get('delaySeconds')) || 5;
        
        document.getElementById('domainDisplay').textContent = domain;
        
        let remaining = delaySeconds;
        const CIRCUMFERENCE = 295;
        document.getElementById('timerText').textContent = remaining;
        document.getElementById('countdownText').textContent = remaining;
        
        const interval = setInterval(() => {
            remaining--;
            document.getElementById('timerText').textContent = remaining;
            document.getElementById('countdownText').textContent = remaining;
            document.getElementById('progressFill').style.width = ((delaySeconds - remaining) / delaySeconds * 100) + '%';
            document.getElementById('progressCircle').style.strokeDashoffset = CIRCUMFERENCE * (1 - (delaySeconds - remaining) / delaySeconds);
            
            if (remaining <= 0) {
                clearInterval(interval);
                window.location.reload();
            }
        }, 1000);
    </script>
</body>
</html>
